# Copy this to .github/workflows/snake.yml in your profile repo,
# then trigger it once manually from the Actions tab.
name: Generate snake animation

on:
    schedule:
        - cron: '0 3 * * *' # refresh daily
    workflow_dispatch: # lets you run it by hand
    push:
        branches:
            - main

jobs:
    generate:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Build the snake SVGs
              uses: Platane/snk@v3
              id: snake
              with:
                  github_user_name: ${{ github.repository_owner }}
                  outputs: |
                      dist/snake.svg
                      dist/snake-dark.svg?palette=github-dark

            - name: Push to the output branch
              uses: crazy-max/ghaction-github-pages@v4
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
